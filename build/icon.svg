<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 128 128">
  <!-- Lode app icon, Adwaita style: a notebook (soft bottom thickness, darker spine) with white
       lines and one gold line, your highlighted point. Loose pages stick out unevenly behind it,
       a ribbon bookmark hangs from the bottom by the spine,
       and a brain badge stands for the AI that files your points. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 -5)">
    <!-- Loose pages, askew, sticking out of the top and right edges -->
    <g transform="rotate(12 64 62)">
      <rect x="38" y="16" width="72" height="88" rx="4" fill="#9a9996"/>
      <rect x="38" y="14" width="72" height="88" rx="4" fill="#f6f5f4"/>
      <path d="M90 34h12M90 46h12M90 58h12" stroke="#9a9996" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="rotate(-7 64 62)">
      <rect x="30" y="8" width="74" height="92" rx="4" fill="#9a9996"/>
      <rect x="30" y="6" width="74" height="92" rx="4" fill="#ffffff"/>
    </g>
    <g transform="rotate(4 64 62)">
      <rect x="34" y="10" width="76" height="94" rx="4" fill="#9a9996"/>
      <rect x="34" y="8" width="76" height="94" rx="4" fill="#deddda"/>
      <path d="M96 26h8M96 38h8" stroke="#77767b" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Ribbon bookmark, hanging out of the bottom -->
  <path d="M38 96h14v30l-7-6-7 6z" fill="#a51d2d"/>
  <path d="M38 96h11v28l-5.5-4.6-5.5 4.6z" fill="#e01b24"/>
  <g transform="translate(0 -5)">
    <!-- Notebook -->
    <rect x="22" y="18" width="80" height="98" rx="10" fill="#0f3d7a"/>
    <rect x="22" y="12" width="80" height="98" rx="10" fill="url(#face)"/>
    <path d="M32 12v98a10 10 0 0 1-10-10V22a10 10 0 0 1 10-10z" fill="#1a5fb4"/>
    <path d="M32 12v98" stroke="#0f3d7a" stroke-width="2"/>
    <!-- Lines -->
    <path d="M44 36h44M44 72h44M44 90h28" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M44 54h44" stroke="#f8e45c" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Brain badge: the AI that files your points -->
  <g transform="translate(99 98)">
    <g fill="#613583" transform="translate(0 4)"><circle cx="-9" cy="-5" r="9"/><circle cx="0" cy="-8" r="9.5"/><circle cx="9" cy="-5" r="9"/><circle cx="-11" cy="5" r="8"/><circle cx="11" cy="5" r="8"/><circle cx="0" cy="6" r="9.5"/></g>
    <g fill="#dc8add" stroke="#dc8add" stroke-width="0"><circle cx="-9" cy="-5" r="9"/><circle cx="0" cy="-8" r="9.5"/><circle cx="9" cy="-5" r="9"/><circle cx="-11" cy="5" r="8"/><circle cx="11" cy="5" r="8"/><circle cx="0" cy="6" r="9.5"/></g>
    <path d="M0 -15v28M-13 -3c4 1 7-1 7-6M13 -3c-4 1-7-1-7-6M-15 4c4 0 5 4 9 4M15 4c-4 0-5 4-9 4M-8 13c1-2 3-3 4-2M8 13c-1-2-3-3-4-2M-4 -12c1 3 1 5-1 7M4 -12c-1 3-1 5 1 7"
      fill="none" stroke="#9141ac" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
